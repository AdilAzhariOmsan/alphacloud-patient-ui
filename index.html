<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patient Management · Alphacloud</title>
  <meta name="description" content="Alphacloud clinic patient management — patient list, details and upcoming appointments." />
  <meta name="theme-color" content="#0052CC" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230052CC'/%3E%3Cpath d='M14 8h4v6h6v4h-6v6h-4v-6H8v-4h6z' fill='white'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <!-- Noto Sans SC is subset to the four glyphs of the page title (患者管理). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700&display=swap&text=%E6%82%A3%E8%80%85%E7%AE%A1%E7%90%86" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <script>
    // Apply the saved sidebar preference before first paint to avoid a layout flash.
    try { if (localStorage.getItem('ac.sidebarCollapsed') === '1') document.documentElement.classList.add('sb-collapsed'); } catch (_) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to patient list</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary"></aside>

    <div class="shell" id="shell">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <section class="card" aria-labelledby="list-title">
          <div id="toolbar"></div>
          <div id="table"></div>
          <div id="pagination"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="dialog-root"></div>
  <div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <noscript>
    <p class="noscript">This app needs JavaScript enabled to load the patient list.</p>
  </noscript>
</body>
</html>
